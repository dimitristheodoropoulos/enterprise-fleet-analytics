name: Fleet Analytics Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff (Code Linting)
        run: |
          ruff check .

      - name: Run Test Suite (mocked DB and LLM client -- no live services required)
        env:
          GEMINI_API_KEY: "dummy-key-for-ci"
        run: |
          PYTHONPATH=. pytest tests/ -v --cov=. --cov-report=term-missing
