# Minimal LOCAL Airflow setup (LocalExecutor) — good enough to build, run, and
# screenshot a DAG for a portfolio. Not the full multi-service production
# CeleryExecutor setup Airflow's own docs use — that's overkill here.
#
# Usage:
#   cd airflow
#   cp .env.example .env        # then edit .env with your real DATABASE_URL
#   docker compose up airflow-init      # first time only: creates DB + admin user
#   docker compose up                   # then start webserver + scheduler
#   open http://localhost:8080  (user: admin / password: admin)

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    _PIP_ADDITIONAL_REQUIREMENTS: 'requests pandas psycopg2-binary dbt-postgres==1.8.0'
    DATABASE_URL: ${DATABASE_URL}
    # dbt's profiles.yml.example expects these four separately (not the single URL)
    SUPABASE_HOST: ${SUPABASE_HOST}
    SUPABASE_USER: ${SUPABASE_USER}
    SUPABASE_PASSWORD: ${SUPABASE_PASSWORD}
    SUPABASE_DBNAME: ${SUPABASE_DBNAME}
  volumes:
    - ./dags:/opt/airflow/dags
    - ../data_pipeline:/opt/airflow/data_pipeline
  depends_on:
    - postgres

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: >
      -c "airflow db init &&
          airflow users create
          --username admin --password admin
          --firstname Dimitris --lastname Theodoropoulos
          --role Admin --email admin@example.com"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

volumes:
  postgres-db-volume:
